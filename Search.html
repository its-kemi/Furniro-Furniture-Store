<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Search | Furniro</title>


    <!-- MAIN CSS -->
    <link rel="stylesheet" href="CSS/style.css">

    <!-- SEARCH CSS -->
    <link rel="stylesheet" href="CSS/Search.css">

    <!-- SCROLL ANIMATION -->
    <link rel="stylesheet" href="CSS/Scroll-Animation.css">

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- =====================================================
     BACK BUTTON
===================================================== -->

<div class="search-back-wrapper">

    <button
        type="button"
        id="searchBackButton"
        class="search-back-button">

        <i class="fa fa-arrow-left"></i>

        Back

    </button>

</div>



<!-- =====================================================
     SEARCH PAGE
===================================================== -->

<main class="search-page">


    <!-- PAGE TITLE -->

    <section class="search-page-header">

        <h1>
            Search Products
        </h1>

        <p id="searchResultText">
            Showing all products
        </p>

    </section>



    <!-- SEARCH INPUT -->

    <section class="search-page-form">

        <div class="search-page-input">

            <input
                type="text"
                id="pageSearchInput"
                placeholder="Search products..."
                autocomplete="off">

            <button
                type="button"
                id="pageSearchButton"
                aria-label="Search">

                <i class="fa fa-search"></i>

            </button>

        </div>

    </section>



    <!-- PRODUCTS -->

    <section
        class="search-products"
        id="searchProducts">

    </section>



    <!-- NO RESULT -->

    <div
        class="search-empty"
        id="searchEmpty"
        style="display: none;">

        <i class="fa fa-search"></i>

        <h2>
            No products found
        </h2>

        <p>
            Try searching for another product.
        </p>

    </div>


</main>



<!-- =====================================================
     SCRIPTS
===================================================== -->

<script src="JS/Search.js"></script>

<script src="JS/Scroll-Animation.js"></script>

<script src="JS/Dark-Mode.js"></script>


</body>

</html>
