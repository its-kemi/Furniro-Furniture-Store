
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | Furniro Furniture Store</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="CSS/style.css">

    <!-- Orders CSS -->
    <link rel="stylesheet" href="CSS/orders.css">
</head>

<body>

    <!-- MY ORDERS PAGE -->
    <main class="orders-page">

        <!-- PAGE HEADER -->
        <header class="orders-header">

            <div class="orders-heading-content">

                <span class="orders-eyebrow">
                    FURNIRO FURNITURE STORE
                </span>

                <h1>My Orders</h1>

                <p>
                    View your purchases, payment information,
                    shipping details, and order status.
                </p>

            </div>

            <a href="index.html" class="back-home-button">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>

        </header>

        <!-- ORDERS CONTENT -->
        <section class="orders-content" aria-label="My orders">

            <!-- SAVED ORDERS -->
            <div
                class="orders-list"
                id="ordersList"
                aria-live="polite"
            ></div>

            <!-- EMPTY ORDERS -->
            <div
                class="empty-orders"
                id="emptyOrders"
                style="display: none;"
            >

                <div class="empty-orders-icon">
                    <i class="fa-solid fa-box-open"></i>
                </div>

                <h2>No Orders Yet</h2>

                <p>
                    You haven't placed any orders yet.
                    Your purchases will appear here.
                </p>

                <a
                    href="Shop.html"
                    class="continue-shopping-button"
                >
                    <i class="fa-solid fa-bag-shopping"></i>
                    Continue Shopping
                </a>

            </div>

        </section>

    </main>

    <!-- AUTHENTICATION GUARD -->
    <script src="JS/Auth-Guard.js"></script>

    <!-- ORDERS JAVASCRIPT -->
    <script src="JS/Orders.js"></script>

</body>

</html>
